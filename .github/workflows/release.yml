name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read
  # Required for npm provenance (publishConfig.provenance in package.json).
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22.18.0"
          registry-url: "https://registry.npmjs.org"
          cache: npm

      - run: npm ci

      # The same gate CI runs, so a tag can never publish something that is broken.
      - run: npm run check

      # prepack rebuilds dist, and files: ["dist"] decides what ships.
      # Provenance requires this repository to stay public; GitHub dropped
      # support for provenance from private sources in July 2023.
      # NPM_TOKEN can be dropped once this repository is registered as a
      # trusted publisher on npmjs.com, which authenticates over OIDC instead.
      # That path needs npm 11.5.1+, so bump node-version to 24 when switching.
      - run: npm publish
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
