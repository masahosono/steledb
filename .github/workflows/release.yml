name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read
  # Required for npm provenance (publishConfig.provenance in package.json).
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # v7 or newer matters here: earlier versions wrote a dummy NODE_AUTH_TOKEN
      # into .npmrc whenever registry-url was set, which gets in the way of the
      # OIDC exchange below. Do not downgrade this one.
      - uses: actions/setup-node@v7
        with:
          # Here for the npm it ships, not for the package: trusted publishing
          # needs npm 11.5.1+, and Node 22 ships 10.x. engines still allows
          # 22.18.0, and ci.yml is what covers the supported range.
          node-version: "24"
          registry-url: "https://registry.npmjs.org"
          cache: npm

      - run: npm ci

      # The same gate CI runs, so a tag can never publish something that is broken.
      - run: npm run check

      # prepack rebuilds dist, and files: ["dist"] decides what ships.
      #
      # No token: npm authenticates over OIDC against the trusted publisher
      # registered for this package on npmjs.com (owner, repository and this
      # workflow's filename all have to match). The credential is minted per run
      # and expires with it, so there is nothing to leak or rotate.
      #
      # Provenance is automatic on this path. publishConfig.provenance stays set
      # in package.json anyway, so a fallback publish would still be attested —
      # and that requires the repository to remain public, since the attestation
      # goes to a public transparency log.
      - run: npm publish
